[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocab-zero"
version = "0.1.0"
description = "Open-source Dynamic Lexicon-Learning Translator that dynamically learns translation pairs in real-time."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2,<3",
    "openai>=1,<2",
    "chromadb>=1.0,<2",
    "transformers>=4.40.0,<5",
    "torch>=2.0.0,<3",
    "fastapi>=0.110.0,<0.112.0",
    "uvicorn>=0.28.0,<0.30.0",
    "praat-parselmouth>=0.4,<0.5",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_zero"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/vocab_zero --cov-report=term-missing --cov-fail-under=80"

[project.scripts]
vocabzero-api = "vocab_zero.interfaces.api:main"
